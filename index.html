<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>Contas em dia</title>
<style>
:root{--navy:#102a43;--blue:#1976d2;--sky:#eaf4ff;--green:#1f9d68;--red:#d64545;--ink:#243b53;--muted:#627d98;--line:#d9e2ec;--bg:#f5f8fb;--white:#fff;--shadow:0 12px 28px #102a4312}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:980px;margin:auto;padding:22px 16px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border-radius:14px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:23px;box-shadow:var(--shadow)}h1{font-size:25px;line-height:1.1;margin:0;color:var(--navy)}.sub{color:var(--muted);margin-top:4px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer;font-size:14px}.primary{background:var(--blue);color:white}.soft{background:var(--sky);color:var(--blue)}.danger{background:#fff0f0;color:var(--red)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-weight:600;margin-bottom:7px}.stat strong{font-size:22px;color:var(--navy)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:180px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px;background:#fff}.filters{display:flex;gap:6px}.filter{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:9px 12px;cursor:pointer}.filter.active{background:var(--navy);color:#fff;border-color:var(--navy)}.list{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 15px;display:grid;grid-template-columns:1fr auto;gap:12px;box-shadow:var(--shadow)}.card.overdue{border-left:5px solid var(--red)}.card.soon{border-left:5px solid #e6a400}.card.paid{border-left:5px solid var(--green);opacity:.78}.name-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.name{font-weight:800;font-size:16px;color:var(--navy)}.tag{font-size:11px;font-weight:800;border-radius:99px;padding:4px 8px;background:#eef2f6;color:var(--muted)}.tag.red{background:#fff0f0;color:var(--red)}.tag.yellow{background:#fff8df;color:#9a7000}.tag.green{background:#e9f8f0;color:var(--green)}.details{display:flex;flex-wrap:wrap;gap:16px;margin-top:9px;color:var(--muted);font-size:13px}.amount{font-weight:800;color:var(--navy);font-size:17px}.actions{display:flex;align-items:center;gap:7px}.icon{width:35px;height:35px;border:1px solid var(--line);background:#fff;border-radius:10px;cursor:pointer;color:var(--muted);font-size:16px}.empty{text-align:center;padding:36px 15px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}.modal-back{position:fixed;inset:0;background:#102a4366;display:none;place-items:center;padding:16px;z-index:5}.modal-back.open{display:grid}.modal{background:#fff;border-radius:18px;width:min(520px,100%);padding:22px;box-shadow:0 20px 60px #102a4340}.modal h2{margin:0 0 16px;color:var(--navy);font-size:20px}.form{display:grid;gap:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:var(--muted);font-weight:800;display:grid;gap:6px}input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;color:var(--ink)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}@media(max-width:600px){.app{padding:16px 12px}.top{align-items:flex-start}.top .btn{padding:10px}.stats{gap:7px}.stat{padding:12px 10px}.stat strong{font-size:17px}.stat small{font-size:11px}.card{grid-template-columns:1fr}.actions{justify-content:flex-end}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="logo">✓</div><div><h1>Contas em dia</h1><div class="sub">Controle seus pagamentos sem esquecer nada</div></div></div><button class="btn primary" id="addTop">＋ Adicionar</button></header>
<section class="stats"><div class="stat"><small>Em aberto</small><strong id="openCount">0</strong></div><div class="stat"><small>Vencendo em 7 dias</small><strong id="soonCount">0</strong></div><div class="stat"><small>Valor em aberto</small><strong id="openTotal">R$ 0,00</strong></div></section>
<section class="toolbar"><input class="search" id="search" placeholder="Buscar conta..." aria-label="Buscar conta"><div class="filters"><button class="filter active" data-filter="all">Todas</button><button class="filter" data-filter="open">Abertas</button><button class="filter" data-filter="paid">Pagas</button></div><button class="btn soft" id="notifyBtn">🔔 Ativar alertas</button><button class="btn soft" id="exportBtn">↓ Backup</button><button class="btn soft" id="importBtn">↑ Restaurar</button><input type="file" id="importFile" accept="application/json" hidden></section>
<section class="list" id="list"></section>
</main>
<div class="modal-back" id="modalBack"><div class="modal"><h2 id="modalTitle">Adicionar pagamento</h2><form class="form" id="form"><input type="hidden" id="editId"><label>Nome da conta<input id="name" required placeholder="Ex.: Energia elétrica"></label><div class="grid"><label>Valor (opcional)<input id="amount" type="number" min="0" step="0.01" placeholder="0,00"><span style="display:flex;align-items:center;gap:6px;font-weight:600"><input id="fixedAmount" type="checkbox" style="width:auto"> Fixar este valor</span></label><label>Data de vencimento<input id="due" type="date" required></label></div><label>Avisar com quantos dias de antecedência?<input id="alertDays" type="number" min="0" max="30" value="3"></label><label style="display:flex;align-items:center;gap:8px;font-size:14px"><input id="recurring" type="checkbox" style="width:auto"> Repetir automaticamente todo mês</label><div class="modal-actions"><button type="button" class="btn soft" id="cancel">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div></form></div></div>
<script>
const initial=['Caixa','Seguro carro','Claro','Copel','Tesserve cancun','Garante capao','Estacionamento'];
let bills=JSON.parse(localStorage.getItem('contas-em-dia')||'null')||initial.map((name,i)=>({id:Date.now()+i,name,amount:'',due:'',alertDays:3,recurring:false,paid:false}));
let currentFilter='all';
const $=id=>document.getElementById(id); const save=()=>localStorage.setItem('contas-em-dia',JSON.stringify(bills));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const today=()=>{let d=new Date();d.setHours(0,0,0,0);return d};
function daysTo(date){if(!date)return 9999;let d=new Date(date+'T00:00:00');return Math.ceil((d-today())/86400000)}
function status(b){if(b.paid)return ['Pago','green'];let n=daysTo(b.due);if(!b.due)return ['Sem data',''];if(n<0)return ['Vencida','red'];if(n<=7)return [n===0?'Vence hoje':`Vence em ${n} dia${n===1?'':'s'}`,'yellow'];return ['Em aberto','']}
function fmtDate(s){if(!s)return 'Data não informada';let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
function render(){let q=$('search').value.toLowerCase();let visible=bills.filter(b=>(currentFilter==='all'||(currentFilter==='paid'?b.paid:!b.paid))&&b.name.toLowerCase().includes(q));$('list').innerHTML=visible.length?visible.map(b=>{let [label,cls]=status(b);return `<article class="card ${cls==='red'?'overdue':cls==='yellow'?'soon':b.paid?'paid':''}"><div><div class="name-row"><span class="name">${esc(b.name)}</span><span class="tag ${cls}">${label}</span></div><div class="details"><span>📅 ${fmtDate(b.due)}</span>${b.amount?`<span class="amount">${money(b.amount)}</span>`:''}<span>🔔 ${b.alertDays} dia${b.alertDays==1?'':'s'} antes</span>${b.recurring?'<span>🔁 Mensal</span>':''}${b.fixedAmount&&b.amount?'<span>📌 Valor fixo</span>':''}</div></div><div class="actions"><button class="icon" title="Marcar como paga" onclick="togglePaid(${b.id})">${b.paid?'↩':'✓'}</button><button class="icon" title="Fixar ou liberar valor" onclick="toggleFixed(${b.id})">${b.fixedAmount?'📌':'📍'}</button><button class="icon" title="Editar" onclick="editBill(${b.id})">✎</button><button class="icon" title="Excluir" onclick="deleteBill(${b.id})">🗑</button></div></article>`}).join(''):'<div class="empty">Nenhuma conta encontrada.<br><button class="btn soft" style="margin-top:12px" onclick="openModal()">Adicionar primeira conta</button></div>';
let open=bills.filter(b=>!b.paid), soon=open.filter(b=>daysTo(b.due)>=0&&daysTo(b.due)<=7);$('openCount').textContent=open.length;$('soonCount').textContent=soon.length;$('openTotal').textContent=money(open.reduce((s,b)=>s+Number(b.amount||0),0));}
function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openModal(b){$('modalBack').classList.add('open');$('modalTitle').textContent=b?'Editar pagamento':'Adicionar pagamento';$('editId').value=b?.id||'';$('name').value=b?.name||'';$('amount').value=b?.amount||'';$('fixedAmount').checked=!!b?.fixedAmount;$('due').value=b?.due||'';$('alertDays').value=b?.alertDays??3;$('recurring').checked=!!b?.recurring;setTimeout(()=>$('name').focus(),50)}
function closeModal(){$('modalBack').classList.remove('open')}
function editBill(id){openModal(bills.find(b=>b.id===id))}
function toggleFixed(id){let b=bills.find(x=>x.id===id);if(!b.amount){alert('Informe um valor antes de fixá-lo.');return}b.fixedAmount=!b.fixedAmount;save();render()}
function togglePaid(id){let b=bills.find(x=>x.id===id);b.paid=!b.paid;if(b.paid&&b.recurring){let d=new Date(b.due+'T00:00:00');d.setMonth(d.getMonth()+1);bills.push({...b,id:Date.now(),due:d.toISOString().slice(0,10),paid:false});}save();render()}
function deleteBill(id){let b=bills.find(x=>x.id===id);if(confirm(`Excluir “${b.name}”?`)){bills=bills.filter(x=>x.id!==id);save();render()}}
function exportData(){let blob=new Blob([JSON.stringify({app:'Contas em dia',version:2,exportedAt:new Date().toISOString(),bills},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='contas-em-dia-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(file){let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);let incoming=Array.isArray(data)?data:data.bills;if(!Array.isArray(incoming))throw Error();bills=incoming.map((b,i)=>({...b,id:b.id||Date.now()+i,alertDays:Number(b.alertDays??3),recurring:!!b.recurring,fixedAmount:!!b.fixedAmount,paid:!!b.paid}));save();render();alert('Backup restaurado com sucesso.')}catch(e){alert('Não foi possível restaurar este arquivo.')}};r.readAsText(file)}
async function enableAlerts(){if(!('Notification'in window)){alert('Seu navegador não oferece notificações.');return}let permission=await Notification.requestPermission();if(permission==='granted'){checkAlerts();$('notifyBtn').textContent='🔔 Alertas ativados';alert('Alertas ativados. Para receber avisos, mantenha o app aberto ou instalado na tela inicial.')}else alert('A permissão de alertas não foi concedida.')}
function checkAlerts(){if(!('Notification'in window)||Notification.permission!=='granted')return;bills.filter(b=>!b.paid&&b.due&&daysTo(b.due)<=Number(b.alertDays||0)&&daysTo(b.due)>=0).forEach(b=>new Notification('Conta próxima do vencimento',{body:`${b.name} vence ${daysTo(b.due)===0?'hoje':'em '+daysTo(b.due)+' dia(s)'}.`}))}
$('form').onsubmit=e=>{e.preventDefault();let id=Number($('editId').value), data={name:$('name').value.trim(),amount:$('amount').value,due:$('due').value,alertDays:Number($('alertDays').value||0),recurring:$('recurring').checked,fixedAmount:$('fixedAmount').checked};if(id){Object.assign(bills.find(b=>b.id===id),data)}else{bills.push({id:Date.now(),...data,paid:false})}save();closeModal();render()};$('addTop').onclick=()=>openModal();$('cancel').onclick=closeModal;$('modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()};$('search').oninput=render;document.querySelectorAll('.filter').forEach(x=>x.onclick=()=>{document.querySelectorAll('.filter').forEach(y=>y.classList.remove('active'));x.classList.add('active');currentFilter=x.dataset.filter;render()});$('exportBtn').onclick=exportData;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};$('notifyBtn').onclick=enableAlerts;render();checkAlerts();
</script>
</body></html>
